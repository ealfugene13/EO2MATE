<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>EO2MATE Payment</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f8fa;color:#111827;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:520px;width:100%;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    h1{font-size:28px;margin:0 0 12px} p{font-size:17px;line-height:1.5;margin:8px 0}.ok{color:#15803d}.bad{color:#b91c1c}
  </style>
</head>
<body><main><h1 id="title">Returning to Messenger…</h1><p id="message">You may close this payment window and return to the Page conversation.</p></main>
<script>
(() => {
  const status = new URLSearchParams(location.search).get('status') || 'success';
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  if (status === 'success') {
    title.textContent = 'Payment complete'; title.className = 'ok';
    message.textContent = 'Your payment is complete. EO2MATE will send the confirmation and shipping link in Messenger. This window can now be closed.';
  } else if (status === 'cancel') {
    title.textContent = 'Payment cancelled';
    message.textContent = 'No payment was completed. Close this window to return to Messenger.';
  } else {
    title.textContent = 'Payment not completed'; title.className = 'bad';
    message.textContent = 'The payment was not completed. Close this window to return to Messenger and use !PAY when you are ready to try again.';
  }

  // Messenger/Facebook in-app browsers may allow the webview to close itself.
  // If the host blocks window.close(), remain on this neutral page; importantly,
  // we never navigate to m.me or open another browser/tab.
  setTimeout(() => { try { window.close(); } catch (_) {} }, 350);
})();
</script></body></html>
