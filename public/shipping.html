<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EO2MATE Shipping</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#111}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin:14px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #bbb;border-radius:9px;font:inherit}button{cursor:pointer;background:#111;color:#fff}.secondary{background:#fff;color:#111}.address{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.ok{color:#087a32}.err{color:#b00020}label{font-size:13px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}</style></head><body><div class="wrap"><h1>Shipping Details</h1><p>Payment is complete. Choose a saved address or provide a new one for this order.</p><div id="msg"></div><div id="saved" class="card hidden"><h2>Saved addresses</h2><div id="addresses"></div><button class="secondary" id="newBtn">+ Add new address</button></div><form id="form" class="card"><h2 id="formTitle">Add shipping address</h2><input id="label" placeholder="Label (Home, Office, etc.)" value="Home"><input id="name" placeholder="Recipient name" required><input id="phone" placeholder="Mobile number" required><input id="a1" placeholder="Address line 1" required><input id="a2" placeholder="Address line 2"><input id="barangay" placeholder="Barangay"><div class="row"><input id="city" placeholder="City / Municipality" required><input id="province" placeholder="Province" required></div><div class="row"><input id="postal" placeholder="Postal code" required><input id="country" value="PH" placeholder="Country"></div><button type="submit">Use this shipping address</button></form><div id="savePrompt" class="card hidden"><h2>Save this address?</h2><p>Would you like to save these shipping details for future EO2MATE orders?</p><input id="saveLabel" value="Home" placeholder="Label (Home, Office, etc.)"><label class="check"><input type="checkbox" id="saveDefault"> Make this my default address</label><button id="saveYes">Save address</button><button id="saveNo" class="secondary">Not now</button></div></div><script>
const BASE='https://mimyptmwejkahfiblopu.supabase.co/functions/v1/eo2mate';const token=new URLSearchParams(location.search).get('token');const msg=document.querySelector('#msg'),saved=document.querySelector('#saved'),addresses=document.querySelector('#addresses'),form=document.querySelector('#form');let selected=null;
async function api(body){const r=await fetch(BASE,{method:'POST',headers:{'Content-Type':'application/json','x-eo2mate-route':'buyer-shipping'},body:JSON.stringify({shipping_token:token,...body})});const x=await r.json();if(!r.ok||!x.success)throw new Error(x.message||x.error||'Request failed');return x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{const d=await api({action:'LOAD'});const list=d.saved_addresses||[];if(list.length){saved.classList.remove('hidden');addresses.innerHTML=list.map(a=>`<div class="address"><b>${esc(a.label)}${a.is_default?' (Default)':''}</b><br>${esc(a.recipient_name)} · ${esc(a.phone)}<br>${esc(a.address_line1)}${a.address_line2?', '+esc(a.address_line2):''}, ${esc(a.city)}, ${esc(a.province)} ${esc(a.postal_code)}<br><button onclick="useAddress('${a.address_id}')">Use this address</button>${!a.is_default?`<button class="secondary" onclick="addressAction('${a.address_id}','SET_DEFAULT')">Set as default</button>`:''}<button class="secondary" onclick="addressAction('${a.address_id}','DELETE')">Delete</button></div>`).join('')} }catch(e){msg.innerHTML=`<p class="err">${esc(e.message)}</p>`;form.classList.add('hidden')}}
window.useAddress=async id=>{try{const d=await api({action:'SAVE',address_id:id});done(d)}catch(e){msg.innerHTML=`<p class="err">${esc(e.message)}</p>`}};
window.addressAction=async(id,address_action)=>{try{await api({action:'ADDRESS',address_id:id,address_action});await load()}catch(e){msg.innerHTML=`<p class="err">${esc(e.message)}</p>`}};
document.querySelector('#newBtn').onclick=()=>{form.scrollIntoView({behavior:'smooth'})};form.onsubmit=async e=>{e.preventDefault();try{const d=await api({action:'SAVE',label:label.value,recipient_name:name.value,phone:phone.value,address_line1:a1.value,address_line2:a2.value,barangay:barangay.value,city:city.value,province:province.value,postal_code:postal.value,country:country.value,save_address:false});done(d)}catch(err){msg.innerHTML=`<p class="err">${esc(err.message)}</p>`}};
function done(d){msg.innerHTML='<p class="ok"><b>Shipping details received.</b></p>';saved.classList.add('hidden');form.classList.add('hidden');if(d?.ask_save_address)document.querySelector('#savePrompt').classList.remove('hidden');else msg.innerHTML+='<p class="ok">Your order is now ready for delivery processing.</p>'};document.querySelector('#saveYes').onclick=async()=>{try{await api({action:'PROFILE_DECISION',save_address:true,label:saveLabel.value,make_default:saveDefault.checked,barangay:barangay.value});document.querySelector('#savePrompt').classList.add('hidden');msg.innerHTML='<p class="ok"><b>Address saved.</b> Your order is ready for delivery processing.</p>'}catch(e){msg.innerHTML=`<p class="err">${esc(e.message)}</p>`}};document.querySelector('#saveNo').onclick=async()=>{try{await api({action:'PROFILE_DECISION',save_address:false});document.querySelector('#savePrompt').classList.add('hidden');msg.innerHTML='<p class="ok">Your order is ready for delivery processing.</p>'}catch(e){msg.innerHTML=`<p class="err">${esc(e.message)}</p>`}};if(!token){msg.innerHTML='<p class="err">Missing shipping token.</p>';form.classList.add('hidden')}else load();
</script></body></html>
